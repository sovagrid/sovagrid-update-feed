name: Stable bootstrap and signed feed on disposable Ubuntu

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      INITIAL_MANIFEST_SHA256: ec6f567b0292916dd3f104f1441451708a955b79d02ef91f82237a8cf8603f1f
      FEED_SCRIPT: /opt/sovagrid-src/sovagrid-blueprint/deploy/release_feed.py
    steps:
      - name: Require a clean disposable runner and prepare Ubuntu directories
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$(cat /proc/1/comm)" = systemd
          test ! -e /opt/sovagrid-src
          test ! -e /etc/sovagrid
          test -d /opt && test ! -L /opt
          sudo -n chown root:root /opt
          sudo -n chmod 0755 /opt
          for directory in /usr/local /usr/local/bin; do
            test -d "$directory" && test ! -L "$directory"
            sudo -n chown root:root "$directory"
            sudo -n chmod 0755 "$directory"
          done
          test ! -L /usr/local/libexec
          sudo -n install -d -o root -g root -m 0755 /usr/local/libexec
          sudo -n systemctl start docker
          sudo -n docker info >/dev/null
          sudo -n docker compose version
      - name: Install the exact reviewed v0.14.1 server package
        run: |
          set -o pipefail
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            https://raw.githubusercontent.com/sovagrid/sovagrid-blueprint/ed672eec0c06a0a032680d9476700c1d2edf1f77/bootstrap/run.sh |
            sudo -n env SOVAGRID_SETUP_NONINTERACTIVE=1 bash
          test "$(sudo -n sha256sum /opt/sovagrid-src/sovagrid-bundle.json | cut -d ' ' -f1)" = \
            "$INITIAL_MANIFEST_SHA256"
          sudo -n systemctl is-active --quiet sovagrid-agent.service
          curl --fail --silent --show-error --max-time 10 http://127.0.0.1:8766/healthz >/dev/null
      - name: Enable the published signed feed with the reviewed state revision
        run: |
          sudo -n python3 -B -I - <<'PY'
          import runpy
          source = '/opt/sovagrid-src/sovagrid-blueprint/deploy/remote_update_worker.py'
          worker = runpy.run_path(source, run_name='sovagrid_feed_diagnostic')
          worker['preview']()
          PY
          sudo -n python3 -B -I "$FEED_SCRIPT" status > "$RUNNER_TEMP/feed-before.json"
          revision=$(python3 - "$RUNNER_TEMP/feed-before.json" "$INITIAL_MANIFEST_SHA256" <<'PY'
          import json, re, sys
          value = json.load(open(sys.argv[1], encoding='utf-8'))
          assert value['enabled'] is False and value['timer_installed'] is True
          assert value['installed_manifest_sha256'] == sys.argv[2]
          assert value['available_keys'] == {
              'sovagrid-2026-10': 'abb6ed34e70fc1dd33d393987fb6067b4a69120eb3a5e00681f209e3666444bf'}
          revision = value['state_revision']
          assert re.fullmatch(r'[0-9a-f]{64}', revision)
          print(revision)
          PY
          )
          sudo -n python3 -B -I "$FEED_SCRIPT" enable --expected-state "$revision"
      - name: Verify the signed release feed recognizes the current installation
        run: |
          sudo -n python3 -B -I "$FEED_SCRIPT" poll | grep -Fx 'SG_RELEASE_FEED:CURRENT'
          test "$(sudo -n sha256sum /opt/sovagrid-src/sovagrid-bundle.json | cut -d ' ' -f1)" = \
            "$INITIAL_MANIFEST_SHA256"
          sudo -n systemctl is-active --quiet sovagrid-agent.service
          curl --fail --silent --show-error --max-time 15 http://127.0.0.1:8766/healthz >/dev/null
          sudo -n docker compose --env-file /etc/sovagrid/deploy.env \
            -f /opt/sovagrid-src/sovagrid-blueprint/deploy/compose.yaml \
            ps --status running --quiet hub | grep -q .
      - name: Verify the subscription survived and disable it with fresh CAS
        run: |
          sudo -n python3 -B -I "$FEED_SCRIPT" status > "$RUNNER_TEMP/feed-after.json"
          revision=$(python3 - "$RUNNER_TEMP/feed-after.json" "$INITIAL_MANIFEST_SHA256" <<'PY'
          import json, re, sys
          value = json.load(open(sys.argv[1], encoding='utf-8'))
          assert value['enabled'] is True and value['timer_installed'] is True
          assert value['installed_manifest_sha256'] == sys.argv[2]
          assert value['ledger']['last_seen_at'] > 0
          assert value['ledger']['highest_issued_at'] > 0
          assert value['manual_candidate_active'] is False
          revision = value['state_revision']
          assert re.fullmatch(r'[0-9a-f]{64}', revision)
          print(revision)
          PY
          )
          sudo -n python3 -B -I "$FEED_SCRIPT" disable --expected-state "$revision"
          sudo -n python3 -B -I "$FEED_SCRIPT" status > "$RUNNER_TEMP/feed-disabled.json"
          python3 - "$RUNNER_TEMP/feed-disabled.json" <<'PY'
          import json, sys
          value = json.load(open(sys.argv[1], encoding='utf-8'))
          assert value['enabled'] is False
          assert value['timer_active'] is False and value['timer_enabled'] is False
          PY
